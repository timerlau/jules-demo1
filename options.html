<!DOCTYPE html>
<html>
<head>
  <title>Immersive Translate Options</title>
  <style>
    body { font-family: sans-serif; margin: 20px; }
    .container { max-width: 600px; margin: auto; }
    h2 { border-bottom: 1px solid #eee; padding-bottom: 10px; }
    label { display: block; margin-top: 10px; margin-bottom: 5px; font-weight: bold; }
    input[type="text"], input[type="password"] { width: 90%; padding: 8px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; }
    .radio-group label { display: inline-block; margin-right: 15px; font-weight: normal; }
    button { padding: 10px 15px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; margin-top: 20px; }
    button:hover { background-color: #0056b3; }
    #statusArea { margin-top: 15px; padding: 10px; border-radius: 4px; }
    .status-success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .status-error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Immersive Translate Settings</h1>

    <h2>Microsoft Translator Settings</h2>
    <label for="msApiKey">API Key:</label>
    <input type="password" id="msApiKey" name="msApiKey">
    
    <label for="msApiRegion">Region (e.g., eastus):</label>
    <input type="text" id="msApiRegion" name="msApiRegion">

    <h2>Google Translate Settings</h2>
    <label for="googleApiKey">API Key:</label>
    <input type="password" id="googleApiKey" name="googleApiKey">

    <h2>General Page Translation Service</h2>
    <div class="radio-group">
      <input type="radio" id="serviceMicrosoft" name="translationService" value="microsoft">
      <label for="serviceMicrosoft">Microsoft Translator</label>
      
      <input type="radio" id="serviceGoogle" name="translationService" value="google">
      <label for="serviceGoogle">Google Translate</label>
    </div>

    <button id="saveButton">Save Settings</button>
    <div id="statusArea"></div>
  </div>

  <script src="options.js"></script>
</body>
</html>
